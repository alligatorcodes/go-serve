[server]
public_addr = ":8081"
admin_addr = "127.0.0.1:9911"
read_header_timeout = "5s"
read_timeout = "30s"
write_timeout = "30s"
idle_timeout = "60s"
shutdown_timeout = "15s"

[cluster]
enabled = true
node_id = "node-1"
bind_addr = "127.0.0.1:7001"
advertise_addr = "127.0.0.1:7001"
data_dir = "./data/example-cluster-node-1"
bootstrap = true
forward_timeout = "5s"
assignment_ttl = "10m"
[[cluster.peers]]
id = "node-2"
address = "127.0.0.1:7002"
public_url = "http://127.0.0.1:8082"
admin_url = "http://127.0.0.1:9912"
[[cluster.peers]]
id = "node-3"
address = "127.0.0.1:7003"
public_url = "http://127.0.0.1:8083"
admin_url = "http://127.0.0.1:9913"

[control_plane]
ui = true
openapi_path = "/api/openapi.json"

[auth]
mode = "disabled"
session_cookie_name = "go_serve_session"

[limits]
max_connections = 10000
max_in_flight = 1000
max_header_bytes = 1048576
max_body_bytes = 10485760

[[upstreams]]
name = "api"
urls = ["http://127.0.0.1:9000"]
health_path = "/health"
health_interval = "10s"
retry_attempts = 1
circuit_breaker_threshold = 5
circuit_breaker_cooldown = "10s"
dial_timeout = "2s"
request_timeout = "30s"

[[routes]]
name = "api"
host = "api.example.com"
path_prefix = "/"
methods = ["GET", "POST", "PUT", "DELETE"]
upstream = "api"
require_auth = false
