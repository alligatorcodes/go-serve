# Copy this file and provide it with: server -config /path/to/config.toml

[server]
public_addr = ":8080"
admin_addr = "127.0.0.1:9901"
read_header_timeout = "5s"
read_timeout = "30s"
write_timeout = "30s"
idle_timeout = "60s"
shutdown_timeout = "15s"
# Set both paths to enable TLS termination and certificate reloads.
# tls_cert_file = "/etc/go-serve/tls/tls.crt"
# tls_key_file = "/etc/go-serve/tls/tls.key"

[cluster]
# Clustering requires persistent storage and network reachability between nodes.
# enabled = false
# node_id = "node-1"
# bind_addr = "127.0.0.1:7000"
# advertise_addr = "10.0.0.11:7000"
# data_dir = "/var/lib/go-serve/cluster"
# bootstrap = true
# virtual_ip = "10.0.0.100/24"
# interface = "eth0"
# on_leader_command = "/usr/local/bin/go-serve-vip leader $GO_SERVE_VIP $GO_SERVE_INTERFACE"
# on_follower_command = "/usr/local/bin/go-serve-vip follower $GO_SERVE_VIP $GO_SERVE_INTERFACE"
# forward_timeout = "5s"
# assignment_ttl = "10m"
# [[cluster.peers]]
# id = "node-2"
# address = "10.0.0.12:7000"
# public_url = "http://10.0.0.12:8080"

[control_plane]
# The API remains available when this is false. This only controls Swagger UI.
ui = true
openapi_path = "/api/openapi.json"

[auth]
# Valid values: disabled, oidc, bearer.
mode = "disabled"
issuer_url = "https://identity.example.com"
client_id = "edge-server"
client_secret_file = "/run/secrets/oidc-client-secret"
session_secret_file = "/run/secrets/session-secret"
redirect_url = "https://gateway.example.com/oauth2/callback"
# Development-only HTTP redirects require explicit opt-in.
# allow_insecure_redirect = true
session_cookie_name = "go_serve_session"
allowed_scopes = ["openid", "profile", "email"]

[limits]
max_connections = 10000
max_in_flight = 1000
max_header_bytes = 1048576
max_body_bytes = 10485760

[[upstreams]]
name = "api"
urls = ["http://127.0.0.1:9000"]
health_path = "/health"
health_interval = "10s"
retry_attempts = 1
circuit_breaker_threshold = 5
circuit_breaker_cooldown = "10s"
dial_timeout = "2s"
request_timeout = "30s"

[[routes]]
name = "api"
host = "api.example.com"
path_prefix = "/"
methods = ["GET", "POST", "PUT", "DELETE"]
upstream = "api"
require_auth = false
scopes = ["api:read"]
